services:
  backend:
    build:
      context: ./backend

    container_name: media-downloader-api

    ports:
      - "8000:8000"

    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}

    volumes:
      - ./backend:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend

    container_name: media-downloader-web

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend
